apiVersion: apps/v1
kind: Deployment
metadata:
  name: om-flask-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: om-flask-app
  template:
    metadata:
      labels:
        app: om-flask-app
    spec:
      containers:
        - name: om-flask-app
          image: 443920089484.dkr.ecr.us-east-1.amazonaws.com/om-flask-app:v4
          ports:
            - containerPort: 5000
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: om-flask-service
spec:
  type: ClusterIP
  selector:
    app: om-flask-app
  ports:
    - port: 80
      targetPort: 5000

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: om-flask-ingress
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: om-flask-service
                port:
                  number: 5000